name: QA Automation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: "Code Quality — flake8"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install flake8
      - name: Run flake8
        run: flake8 api_tests/ web_tests/ --max-line-length=100 --exclude=__pycache__

  api-tests:
    name: "API Tests — Swagger Petstore"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API test suite
        run: |
          mkdir -p reports
          pytest api_tests/tests/ -v --tb=short \
            --html=reports/api-report.html --self-contained-html \
            --junitxml=reports/api-results.xml
        env:
          API_BASE_URL: https://petstore.swagger.io/v2

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/
          retention-days: 7

  web-tests:
    name: "Web Tests — SauceDemo"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Web test suite
        run: |
          mkdir -p reports screenshots
          pytest web_tests/tests/ -v --tb=short \
            --html=reports/web-report.html --self-contained-html \
            --junitxml=reports/web-results.xml
        env:
          HEADLESS: "true"

      - name: Upload Web test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: reports/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 3
